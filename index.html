<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Personal Finance | Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );
        }

        .login-card {
            width: min(
                420px,
                calc(100% - 30px)
            );

            background: white;

            border-radius: 18px;

            padding: 40px 30px;

            text-align: center;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.08);
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            margin-bottom: 10px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo img {
            width: 80px;
            height: 80px;

            object-fit: cover;

            border-radius: 50%;

            display: block;
        }

        /* =========================
           TITLE
        ========================= */

        h1 {
            font-size: 25px;

            margin-bottom: 8px;

            color: #111827;
        }

        .subtitle {
            color: #6b7280;

            margin-bottom: 30px;
        }

        /* =========================
           GOOGLE LOGIN
        ========================= */

        #googleButton {
            width: 100%;
        }

        .google-login {
            width: 100%;

            padding: 13px 18px;

            border:
                1px solid #d1d5db;

            border-radius: 8px;

            background: white;

            color: #374151;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .google-login:hover {
            background: #f9fafb;
        }

        .google-login:disabled {
            opacity: 0.6;

            cursor: wait;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            margin-top: 20px;

            padding: 12px;

            border-radius: 8px;

            font-size: 14px;

            line-height: 1.6;

            display: none;
        }

        .message.show {
            display: block;
        }

        .error {
            background: #fee2e2;

            color: #991b1b;
        }

        .success {
            background: #dcfce7;

            color: #166534;
        }

        .warning {
            background: #fef3c7;

            color: #92400e;
        }

        .info {
            background: #e0f2fe;

            color: #075985;
        }

        /* =========================
           SECURITY
        ========================= */

        .security {
            margin-top: 25px;

            font-size: 12px;

            color: #9ca3af;

            line-height: 1.6;
        }
    </style>
</head>


<body>

<div class="login-card">

    <!-- =========================
         LOGO
    ========================= -->

    <div class="logo">

        <img
            src="assets/images/messageImage_1790424403882.jpg"
            alt="Personal Finance"
        >

    </div>


    <!-- =========================
         TITLE
    ========================= -->

    <h1>
        Personal Finance
    </h1>


    <p class="subtitle">
        ระบบรายงานผลประกอบการส่วนตัว
    </p>


    <!-- =========================
         GOOGLE LOGIN
    ========================= -->

    <div id="googleButton">

        <button
            id="loginButton"
            class="google-login"
            type="button"
        >
            🔵 เข้าสู่ระบบด้วย Google
        </button>

    </div>


    <!-- =========================
         MESSAGE
    ========================= -->

    <div
        id="message"
        class="message"
        role="alert"
        aria-live="polite"
    ></div>


    <!-- =========================
         SECURITY
    ========================= -->

    <div class="security">

        🔐 ระบบรักษาความปลอดภัย

        <br>

        อนุญาตเฉพาะบัญชีที่ได้รับสิทธิ์เท่านั้น

    </div>

</div>


<script type="module">

import {
    loginWithGoogle
} from "./js/auth.js";


import {
    checkPermission
} from "./js/permission.js";


const loginButton =
    document.getElementById(
        "loginButton"
    );


const message =
    document.getElementById(
        "message"
    );


/* =========================
   LOGIN
========================= */

loginButton.addEventListener(
    "click",
    handleLogin
);


/* =========================
   MAIN LOGIN FUNCTION
========================= */

async function handleLogin() {

    setLoading(true);

    clearMessage();


    try {

        /*
         * ====================================
         * STEP 1
         * Firebase / Google Login
         * ====================================
         */

        const user =
            await loginWithGoogle();


        if (!user) {

            throw new Error(
                "ไม่สามารถเข้าสู่ระบบด้วย Google ได้"
            );

        }


        /*
         * ====================================
         * STEP 2
         * ตรวจสอบสิทธิ์กับ Apps Script
         * ====================================
         */

        showMessage(
            "กำลังตรวจสอบสิทธิ์...",
            "info"
        );


        const permission =
            await checkPermission();


        console.log(
            "ผลการตรวจสอบสิทธิ์:",
            permission
        );


        /*
         * ====================================
         * STEP 3
         * ตรวจสอบผลการตรวจสิทธิ์
         * ====================================
         *
         * สำคัญ:
         *
         * ห้ามใช้เพียง
         *
         * permission.success
         *
         * เป็นตัวตัดสินสิทธิ์
         *
         * ต้องมี authorized === true
         *
         */

        if (
            !permission ||
            permission.authorized !== true
        ) {

            /*
             * ไม่มีข้อมูลสิทธิ์ที่เชื่อถือได้
             */

            const status =
                String(
                    permission?.status || ""
                )
                .trim()
                .toUpperCase();


            /*
             * ผู้ใช้ไม่มีสิทธิ์จริง
             */

            if (
                status === "DENIED" ||
                status === "UNAUTHORIZED" ||
                status === "NOT_FOUND"
            ) {

                throw new Error(
                    "บัญชีของคุณไม่มีสิทธิ์เข้าใช้งานระบบ"
                );

            }


            /*
             * Token ไม่ถูกต้อง
             */

            if (
                status === "INVALID_TOKEN" ||
                status === "NO_TOKEN"
            ) {

                throw new Error(
                    "ไม่สามารถยืนยันตัวตนได้ กรุณาเข้าสู่ระบบใหม่"
                );

            }


            /*
             * ระบบสิทธิ์ไม่ตอบกลับตามรูปแบบที่คาดไว้
             *
             * เพื่อความปลอดภัย
             * จะไม่อนุญาตให้เข้า Dashboard
             */

            throw new Error(
                "ไม่สามารถตรวจสอบสิทธิ์การเข้าใช้งานได้"
            );

        }


        /*
         * ====================================
         * STEP 4
         * อ่านสถานะจากระบบสิทธิ์
         * ====================================
         */

        const userStatus =
            String(
                permission.status ?? "active"
            )
            .trim()
            .toLowerCase();


        /*
         * ====================================
         * STEP 5
         * ตรวจสอบสถานะที่อนุญาต
         * ====================================
         *
         * active
         * และ
         * -
         *
         * ทั้งสองสถานะสามารถเข้า Dashboard ได้
         *
         */

        const isActive =
            userStatus === "active";


        const isUpdating =
            userStatus === "-";


        if (
            !isActive &&
            !isUpdating
        ) {

            /*
             * หากได้รับ status ที่ไม่รู้จัก
             *
             * ไม่ควรเดาว่าเป็น Active
             *
             */

            throw new Error(
                "ไม่สามารถยืนยันสถานะสิทธิ์ของบัญชีได้"
            );

        }


        /*
         * ====================================
         * STEP 6
         * เก็บข้อมูล Session
         * ====================================
         *
         * ใช้สำหรับแสดงผล / UI
         *
         * ไม่ใช่ตัวควบคุมสิทธิ์หลัก
         *
         */

        sessionStorage.setItem(
            "userStatus",
            userStatus
        );


        sessionStorage.setItem(
            "permissionChecked",
            "true"
        );


        if (
            permission.role
        ) {

            sessionStorage.setItem(
                "userRole",
                permission.role
            );

        }


        if (
            permission.account_id
        ) {

            sessionStorage.setItem(
                "accountId",
                permission.account_id
            );

        }


        if (
            permission.name
        ) {

            sessionStorage.setItem(
                "userName",
                permission.name
            );

        }


        /*
         * ====================================
         * STEP 7
         * แสดงสถานะให้ผู้ใช้ทราบ
         * ====================================
         */

        if (isUpdating) {

            showMessage(
                "เข้าสู่ระบบสำเร็จ • ขณะนี้ระบบกำลังอัปเดตข้อมูล",
                "warning"
            );

        } else {

            showMessage(
                "เข้าสู่ระบบสำเร็จ",
                "success"
            );

        }


        /*
         * ====================================
         * STEP 8
         * เข้า Dashboard
         * ====================================
         */

        setTimeout(() => {

            window.location.href =
                "dashboard.html";

        }, 700);

    }


    catch (error) {

        console.error(
            "Login / Permission Error:",
            error
        );


        /*
         * หาก Login ผ่าน Firebase แล้ว
         * แต่ Permission ไม่ผ่าน
         *
         * ไม่ควรปล่อย Session ค้างไว้
         */

        clearPermissionSession();


        showMessage(
            getErrorMessage(error),
            "error"
        );


        setLoading(false);

    }

}


/* =========================
   LOADING
========================= */

function setLoading(isLoading) {

    loginButton.disabled =
        isLoading;


    if (isLoading) {

        loginButton.textContent =
            "กำลังเข้าสู่ระบบ...";

    } else {

        loginButton.textContent =
            "🔵 เข้าสู่ระบบด้วย Google";

    }

}


/* =========================
   ERROR MESSAGE
========================= */

function getErrorMessage(error) {

    if (!error) {

        return "ไม่สามารถเข้าสู่ระบบได้";

    }


    const errorMessage =
        String(
            error.message || error
        );


    /*
     * ไม่มีสิทธิ์
     */

    if (
        errorMessage.includes(
            "ไม่มีสิทธิ์"
        )
    ) {

        return errorMessage;

    }


    /*
     * Token / Authentication
     */

    if (
        errorMessage.includes(
            "INVALID_TOKEN"
        ) ||
        errorMessage.includes(
            "NO_TOKEN"
        ) ||
        errorMessage.includes(
            "token"
        ) ||
        errorMessage.includes(
            "Token"
        ) ||
        errorMessage.includes(
            "auth"
        )
    ) {

        return (
            "ไม่สามารถยืนยันตัวตนได้ " +
            "กรุณาเข้าสู่ระบบใหม่"
        );

    }


    /*
     * Network / Apps Script
     */

    if (
        errorMessage.includes(
            "Failed to fetch"
        ) ||
        errorMessage.includes(
            "NetworkError"
        ) ||
        errorMessage.includes(
            "fetch"
        ) ||
        errorMessage.includes(
            "Network"
        )
    ) {

        return (
            "ไม่สามารถเชื่อมต่อระบบสิทธิ์ได้ " +
            "กรุณาลองใหม่อีกครั้ง"
        );

    }


    /*
     * Permission response ผิดรูปแบบ
     */

    if (
        errorMessage.includes(
            "ตรวจสอบสิทธิ์"
        ) ||
        errorMessage.includes(
            "ยืนยันสถานะสิทธิ์"
        )
    ) {

        return errorMessage;

    }


    return errorMessage;

}


/* =========================
   CLEAR PERMISSION SESSION
========================= */

function clearPermissionSession() {

    sessionStorage.removeItem(
        "userStatus"
    );

    sessionStorage.removeItem(
        "permissionChecked"
    );

    sessionStorage.removeItem(
        "userRole"
    );

    sessionStorage.removeItem(
        "accountId"
    );

    sessionStorage.removeItem(
        "userName"
    );

}


/* =========================
   CLEAR MESSAGE
========================= */

function clearMessage() {

    message.textContent = "";

    message.className =
        "message";

}


/* =========================
   SHOW MESSAGE
========================= */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;


    message.className =
        "message show " + type;

}

</script>

</body>

</html>
