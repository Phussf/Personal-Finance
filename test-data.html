```html
<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Test Financial Data</title>

</head>

<body>

    <h1>ทดสอบข้อมูลการเงิน</h1>

    <button id="btn">
        ดึงข้อมูล Investments
    </button>

    <pre id="output">
ยังไม่ได้เรียกข้อมูล
    </pre>


    <script type="module">

        import {
            getInvestments
        } from "./js/permission.js";


        const button =
            document.getElementById("btn");

        const output =
            document.getElementById("output");


        button.addEventListener(
            "click",
            async () => {

                try {

                    output.textContent =
                        "กำลังโหลด...";


                    const data =
                        await getInvestments();


                    console.log(
                        "Investments:",
                        data
                    );


                    output.textContent =
                        JSON.stringify(
                            data,
                            null,
                            2
                        );


                } catch (error) {

                    console.error(error);


                    output.textContent =
                        "ERROR:\n"
                        + error.message;

                }

            }
        );

    </script>

</body>

</html>
```
